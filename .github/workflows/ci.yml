name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Lint & Format (fast, no build needed for fmt)
  # ============================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libwayland-dev libxkbcommon-dev libvulkan-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: lint-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ============================================================
  # Test - All platforms
  # ============================================================
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libwayland-dev libxkbcommon-dev libvulkan-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-

      - name: Build workspace
        run: cargo build --workspace
        env:
          RUSTFLAGS: "-D warnings"

      - name: Run tests
        shell: bash
        run: cargo test --workspace 2>&1 | tee test-output.txt

      - name: Generate test report
        if: always()
        shell: bash
        run: |
          touch test-output.txt
          echo "# Test Report - ${{ matrix.os }}" > test-report.md
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> test-report.md
          echo "**Rust:** $(rustc --version)" >> test-report.md
          echo "" >> test-report.md
          echo "## Results" >> test-report.md
          echo '```' >> test-report.md
          grep "test result:" test-output.txt >> test-report.md || echo "No test results" >> test-report.md
          echo '```' >> test-report.md
          PASSED=$(grep "test result:" test-output.txt | awk '{sum += $4} END {print sum+0}')
          FAILED=$(grep "test result:" test-output.txt | awk '{sum += $6} END {print sum+0}')
          echo "" >> test-report.md
          echo "**Total: $PASSED passed, $FAILED failed**" >> test-report.md

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: test-report.md

  # ============================================================
  # Build Release Binaries - runs in PARALLEL with lint/test
  # ============================================================
  build:
    name: Build (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Windows x86_64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            artifact: mangameeya-windows-x64
            binary: mangameeya.exe
          - name: Linux x86_64
            os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            artifact: mangameeya-linux-x64
            binary: mangameeya
          - name: macOS x86_64
            os: macos-latest
            rust-target: x86_64-apple-darwin
            artifact: mangameeya-macos-x64
            binary: mangameeya
          - name: macOS ARM64
            os: macos-latest
            rust-target: aarch64-apple-darwin
            artifact: mangameeya-macos-arm64
            binary: mangameeya

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.rust-target }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libwayland-dev libxkbcommon-dev libvulkan-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ matrix.target.rust-target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: build-${{ matrix.target.rust-target }}-

      - name: Build release
        run: cargo build --release --package mangameeya --target ${{ matrix.target.rust-target }}

      - name: Show binary size
        shell: bash
        run: |
          BINARY="target/${{ matrix.target.rust-target }}/release/${{ matrix.target.binary }}"
          if [ -f "$BINARY" ]; then
            SIZE=$(wc -c < "$BINARY")
            echo "Binary size: $((SIZE / 1048576)) MB ($SIZE bytes)"
          else
            echo "Binary not found at $BINARY"
            ls -la target/${{ matrix.target.rust-target }}/release/ || true
          fi

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          BINARY="target/${{ matrix.target.rust-target }}/release/${{ matrix.target.binary }}"
          if [ -f "$BINARY" ]; then
            cp "$BINARY" dist/
          fi
          echo "Build: ${{ matrix.target.name }}"          > dist/BUILD_INFO.txt
          echo "Target: ${{ matrix.target.rust-target }}"  >> dist/BUILD_INFO.txt
          echo "Commit: ${{ github.sha }}"                 >> dist/BUILD_INFO.txt
          echo "Date: $(date -u '+%Y-%m-%d %H:%M UTC')"   >> dist/BUILD_INFO.txt
          echo "Rust: $(rustc --version)"                  >> dist/BUILD_INFO.txt

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact }}
          path: dist/
          retention-days: 90

  # ============================================================
  # WASM Build
  # ============================================================
  build-wasm:
    name: Build (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: wasm-${{ runner.os }}-

      - name: Build WASM
        run: wasm-pack build apps/web --target web --release
        continue-on-error: true

      - name: Upload WASM artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mangameeya-wasm
          path: apps/web/pkg/
          retention-days: 90

  # ============================================================
  # Extra checks (don't block builds)
  # ============================================================
  extras:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Minimal features
            cmd: cargo check --workspace --no-default-features
          - name: Documentation
            cmd: cargo doc --workspace --no-deps
            env: RUSTDOCFLAGS=-D warnings
          - name: Security audit
            cmd: cargo install cargo-audit --locked && cargo audit
            allow-fail: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libwayland-dev libxkbcommon-dev libvulkan-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: extra-${{ matrix.check.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: extra-${{ matrix.check.name }}-

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.cmd }}
        continue-on-error: ${{ matrix.check.allow-fail == true }}
        env:
          RUSTFLAGS: "-D warnings"

  # ============================================================
  # Benchmarks & Coverage (after tests pass)
  # ============================================================
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libwayland-dev libxkbcommon-dev libvulkan-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bench-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: bench-${{ runner.os }}-

      - name: Generate test data
        run: cargo run --release --package xtask -- generate-testdata --output testdata/generated

      - name: Run benchmarks
        run: cargo bench --workspace 2>&1 | tee bench-output.txt || true

      - name: Generate performance report
        shell: bash
        run: |
          echo "# Performance Report" > perf-report.md
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> perf-report.md
          echo "**Commit:** \`${{ github.sha }}\`" >> perf-report.md
          echo "**CPU:** $(lscpu | grep 'Model name' | sed 's/.*: *//')" >> perf-report.md
          echo "" >> perf-report.md
          echo "## Benchmarks" >> perf-report.md
          echo '```' >> perf-report.md
          cat bench-output.txt >> perf-report.md
          echo '```' >> perf-report.md
          echo "" >> perf-report.md
          echo "## Test Data" >> perf-report.md
          echo '```' >> perf-report.md
          du -sh testdata/generated/* 2>/dev/null >> perf-report.md || echo "none" >> perf-report.md
          echo '```' >> perf-report.md

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: perf-report.md

      - name: Upload criterion reports
        uses: actions/upload-artifact@v4
        with:
          name: criterion-reports
          path: target/criterion/
          retention-days: 14
          if-no-files-found: ignore

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libwayland-dev libxkbcommon-dev libvulkan-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cov-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cov-${{ runner.os }}-

      - name: Generate coverage
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov --workspace --text 2>&1 | tee coverage-text.txt

      - name: Generate coverage report
        shell: bash
        run: |
          echo "# Code Coverage Report" > coverage-report.md
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> coverage-report.md
          echo "**Commit:** \`${{ github.sha }}\`" >> coverage-report.md
          echo "" >> coverage-report.md
          echo '```' >> coverage-report.md
          cat coverage-text.txt >> coverage-report.md
          echo '```' >> coverage-report.md

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage-report.md
            lcov.info

  # ============================================================
  # Summary
  # ============================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, build, build-wasm, extras, benchmarks, coverage]
    steps:
      - name: Generate summary
        shell: bash
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Builds | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| WASM | ${{ needs.build-wasm.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Extras | ${{ needs.extras.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Benchmarks | ${{ needs.benchmarks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | ${{ needs.coverage.result }} |" >> $GITHUB_STEP_SUMMARY
